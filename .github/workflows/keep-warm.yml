# Keeps 9amcrew.ca's server warm from about 6 AM to 10 PM Halifax time,
# so opening the app doesn't wait on a cold start.
name: Keep warm
on:
  schedule:
    - cron: '*/5 9-23 * * *'
    - cron: '*/5 0-1 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -fsS -o /dev/null -w '%{http_code} in %{time_total}s\n' https://9amcrew.ca/api/warm
          curl -fsS -o /dev/null -w 'login %{http_code} in %{time_total}s\n' https://9amcrew.ca/login
